[project]
name = "marthouse"
version = "0.1.0"
description = "Marthouse: a GUI for dbt Core and dlt. Runs locally or as a hosted service."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "ruamel.yaml>=0.18",
  "keyring>=25",
  "cryptography>=43",
  "argon2-cffi>=23",
  "httpx>=0.27",
  "packaging>=24",
  "platformdirs>=4",
  "python-multipart>=0.0.9",
  "uv>=0.4",
]

[project.optional-dependencies]
hosted = ["arq>=0.26", "redis>=5", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
marthouse = "marthouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marthouse"]
artifacts = ["marthouse/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
