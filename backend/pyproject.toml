[project]
name = "marthouse"
version = "0.1.1"
description = "The open-source app for dbt Core and dlt: load, transform and explore your data without living in a terminal."
readme = "README.md"
authors = [{ name = "Glenn Dalida" }]
keywords = ["dbt", "dbt-core", "dlt", "data", "analytics-engineering", "elt", "sql", "lineage", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "ruamel.yaml>=0.18",
  "keyring>=25",
  "cryptography>=43",
  "argon2-cffi>=23",
  "httpx>=0.27",
  "packaging>=24",
  "platformdirs>=4",
  "python-multipart>=0.0.9",
  "uv>=0.4",
]

[project.urls]
Homepage = "https://github.com/godalida/marthouse"
Source = "https://github.com/godalida/marthouse"
Issues = "https://github.com/godalida/marthouse/issues"
Changelog = "https://github.com/godalida/marthouse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
hosted = ["arq>=0.26", "redis>=5", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
marthouse = "marthouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marthouse"]
artifacts = ["marthouse/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
