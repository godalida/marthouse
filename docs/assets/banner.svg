<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Marthouse: load, transform and explore your data, a GUI for dbt and dlt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171C"/>
      <stop offset="1" stop-color="#0F0F12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5B5BD6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B5BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7EFF"/>
      <stop offset="1" stop-color="#3F3FB8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- app mark -->
  <g transform="translate(88 104)">
    <rect width="96" height="96" rx="22" fill="url(#mark)"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
      <path d="M30 30c18 0 18 18 36 18M30 66c18 0 18-18 36-18"/>
    </g>
    <g fill="#fff"><circle cx="27" cy="30" r="8"/><circle cx="27" cy="66" r="8"/><circle cx="69" cy="48" r="9"/></g>
  </g>
  <text x="88" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Marthouse</text>
  <text x="90" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#B9B9C6">Load, transform and explore your data in one app.</text>
  <text x="90" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#8A8A99">A GUI for dbt Core and dlt, for analytics engineers and analysts.</text>

  <!-- mini lineage on the right -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">
    <g fill="none" stroke="#5B5BD6" stroke-width="2" stroke-opacity="0.9">
      <path d="M866 140 C906 140 906 200 946 200"/>
      <path d="M866 260 C906 260 906 200 946 200"/>
      <path d="M1082 200 C1110 200 1110 200 1130 200"/>
    </g>
    <g>
      <rect x="730" y="114" width="136" height="52" rx="10" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.14" stroke-dasharray="4 3"/>
      <text x="746" y="136" fill="#8A8A99" font-size="11">pipeline</text>
      <text x="746" y="154" fill="#FFFFFF" font-weight="600">github_issues</text>
      <rect x="730" y="234" width="136" height="52" rx="10" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.14" stroke-dasharray="4 3"/>
      <text x="746" y="256" fill="#8A8A99" font-size="11">pipeline</text>
      <text x="746" y="274" fill="#FFFFFF" font-weight="600">app_database</text>
      <rect x="946" y="174" width="136" height="52" rx="10" fill="#1E1E24" stroke="#5B5BD6" stroke-width="2"/>
      <text x="962" y="196" fill="#A7A9FF" font-size="11">model · table</text>
      <text x="962" y="214" fill="#FFFFFF" font-weight="600">weekly_revenue</text>
      <rect x="1130" y="174" width="94" height="52" rx="10" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="1146" y="196" fill="#8A8A99" font-size="11">tests</text>
      <circle cx="1150" cy="210" r="4" fill="#4ADE80"/>
      <text x="1160" y="214" fill="#FFFFFF" font-weight="600">12 pass</text>
    </g>
