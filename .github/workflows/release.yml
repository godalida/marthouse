# Publishes Marthouse to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (no API token): the "pypi" environment and this file name
# must match the pending publisher configured on pypi.org.
name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app into the Python package
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        working-directory: backend
        run: |
          python ../scripts/pypi_readme.py
          uv build
      - name: Check the wheel contains the web app
        working-directory: backend
        run: python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(n.startswith('marthouse/static/') for n in z.namelist()), 'web app missing'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
